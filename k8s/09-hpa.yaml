apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-app
  namespace: taskapp
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: task-app}
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
