# Needs a CNI that enforces policies (for example Calico or Cilium).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: taskapp
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-allow-http
  namespace: taskapp
spec:
  podSelector:
    matchLabels: {app: task-app}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 3000}
---
# PostgreSQL: only the app pods may connect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-app
  namespace: taskapp
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: task-app}
      ports:
        - {protocol: TCP, port: 5432}
