# Needs an ingress controller (for example ingress-nginx) installed in the cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-app
  namespace: taskapp
spec:
  ingressClassName: nginx
  rules:
    - host: tasks.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: task-app, port: {number: 80}}
