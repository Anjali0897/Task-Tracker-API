apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-app
  namespace: taskapp
spec:
  replicas: 3                        # HPA manages this after the first apply
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  selector:
    matchLabels: {app: task-app}
  template:
    metadata:
      labels: {app: task-app}
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: task-app}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Do not start the app until PostgreSQL answers on 5432
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 3 taskdb 5432; do echo waiting for taskdb; sleep 3; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      containers:
        - name: app
          image: anjaligundavaram/python-trackapi:app       # Jenkins updates this tag
          ports:
            - {name: http, containerPort: 3000}
          envFrom:
            - configMapRef: {name: task-config}
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: task-db, key: DB_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: task-db, key: DB_PASSWORD}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}       # let the load balancer drain first
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
